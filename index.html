<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mi Realidad Aumentada</title>

  <!-- Librería A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Librería MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/shakou-u/TAREAYAAAA/main/ImagenesParaGITHUB/targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- Imagen que aparecerá -->
   <a-assets>
  <img
    id="imagenAR"
    src="https://raw.githubusercontent.com/shakou-u/TAREAYAAAA/main/imagen3.PNG"
    crossorigin="anonymous">
</a-assets>

    <!-- Cámara -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Imagen que reconocerá la cámara -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Segunda imagen en realidad aumentada -->
   <a-plane
  src="#imagenAR"
  position="0 0 0.01"
  width="0.65"
  height="1"
  rotation="0 0 0"
  material="transparent: true; side: double">
</a-plane>

    </a-entity>

  </a-scene>

</body>
</html>

</body>
</html>
