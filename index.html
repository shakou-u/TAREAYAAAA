<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Mi Realidad Aumentada 3D</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
   mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- CARGAMOS LOS DOS MODELOS 3D -->

  <a-assets timeout="120000">

  <!-- NYAN CAT -->
  <a-asset-item
    id="nyanCat"
    src="./pixel_art_nyan_cat.glb">
  </a-asset-item>

  <!-- CARACOLITO -->
  <a-asset-item
    id="caracol"
    src="./snail.glb">
  </a-asset-item>

</a-assets>

<!-- CÁMARA -->
<a-camera
  position="0 0 0"
  look-controls="enabled: false">
</a-camera>

<!-- PRIMERA IMAGEN: NYAN CAT -->
<a-entity mindar-image-target="targetIndex: 0">

  <a-gltf-model
    src="#nyanCat"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="0.5 0.5 0.5">
  </a-gltf-model>

</a-entity>

<!-- SEGUNDA IMAGEN: CARACOLITO -->
<a-entity mindar-image-target="targetIndex: 1">

  <a-gltf-model
    src="#caracol"
    position="0 0 0.1"
    rotation="0 0 0"
    scale="0.5 0.5 0.5">
  </a-gltf-model>

</a-entity>
  </a-scene>

</body>
</html>
